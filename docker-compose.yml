services:
  wiseflow:
    build: .
    image: wiseflow-java:1.0
    container_name: wiseflow-java
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:h2:file:/app/data/newsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=FALSE"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
