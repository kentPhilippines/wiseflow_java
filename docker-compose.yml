services:
  wiseflow:
    build: .
    image: wiseflow-java:1.0
    container_name: wiseflow-java
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
