<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>域名配置管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 添加SheetJS库 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .card {
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .table-responsive {
            margin-top: 20px;
        }

        .action-buttons .btn {
            margin-right: 5px;
        }

        /* 自定义tooltip样式 */
        .custom-tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            max-width: 300px;
            z-index: 1000;
            word-wrap: break-word;
            pointer-events: none;
            transition: opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">域名配置管理</h5>
                        <div>
                            <a href="/comment/rule" class="btn btn-sm btn-outline-light me-2">
                                <i class="fas fa-comments me-2"></i>
                                <span th:text="#{rule.comment}">评论规则</span>
                            </a>
                            <a href="/seo-keywords" class="btn btn-sm btn-outline-light me-2">
                                <i class="fas fa-tags me-2"></i>
                                <span th:text="#{rule.seo}">SEO关键词</span>
                            </a>
                            <a href="/article/rule" class="btn btn-sm btn-outline-light me-2">
                                <i class="fas fa-file-alt me-2"></i>
                                <span th:text="#{rule.article}">文章分配规则</span>
                            </a>
                            <button class="btn btn-sm btn-light me-2" id="uploadTemplateBtn">
                                <i class="bi bi-upload"></i> 批量上站
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <!-- 批量操作工具栏 -->
                        <div id="batchOperations" class="mb-3 p-2 bg-light rounded d-none">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted">
                                    <i class="bi bi-check-square me-1"></i>
                                    已选中 <span id="selectedCount" class="fw-bold text-primary">0</span> 个域名配置
                                </span>
                                <div class="btn-group btn-group-sm">
                                    <button type="button" class="btn btn-outline-success" onclick="batchUpdateSelectedStatus(1)">
                                        <i class="bi bi-check-circle"></i> 批量启用
                                    </button>
                                    <button type="button" class="btn btn-outline-warning" onclick="batchUpdateSelectedStatus(0)">
                                        <i class="bi bi-pause-circle"></i> 批量禁用
                                    </button>
                                    <button type="button" class="btn btn-outline-danger" onclick="batchDeleteSelected()">
                                        <i class="bi bi-trash"></i> 批量删除
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="selectAll">
                                            </div>
                                        </th>
                                        <th>服务器编号</th>
                                        <th>批次数量</th>
                                        <th>域名总数</th>
                                    <!--     <th>状态</th>
                                        <th>操作</th> -->
                                    </tr>
                                </thead>
                                <tbody id="phoneGroupTableBody">
                                    <!-- 手机号分组数据将通过JavaScript动态加载 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 上传模板模态框 -->
    <div class="modal fade" id="uploadTemplateModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">上传配置模板</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="templateFile" class="form-label">选择模板文件</label>
                        <input class="form-control" type="file" id="templateFile" accept=".xlsx,.xls">
                        <div class="form-text">支持Excel格式</div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="templateOverwriteExisting">
                        <label class="form-check-label" for="templateOverwriteExisting">
                            默认覆盖已存在的域名配置
                        </label>
                    </div>
                    <div class="mt-3">
                        <a href="/admin/config/domain/excel-template" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-download"></i> 下载Excel模板
                        </a>
                    </div>

                    <!-- 添加解析结果预览区域 -->
                    <div id="parseResultArea" class="mt-4 d-none">
                        <h6 class="border-bottom pb-2">数据预览</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered table-hover">
                                <thead class="table-light">
                                    <tr>
                                        <th>域名</th>
                                        <th>标题</th>
                                        <th>描述</th>
                                        <th>关键词</th>
                                        <th>服务器编号</th>
                                        <th>手机号</th>
                                        <th>状态</th>
                                        <th>配置</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="parseResultTableBody">
                                    <!-- 解析结果将在这里动态显示 -->
                                </tbody>
                            </table>
                        </div>

                        <!-- 统计信息 -->
                        <div class="alert alert-info mt-2">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <span>总记录: <span id="totalRecords" class="fw-bold">0</span></span>
                                    <span class="ms-3">新增: <span id="newRecords"
                                            class="fw-bold text-success">0</span></span>
                                    <span class="ms-3">冲突: <span id="conflictRecords"
                                            class="fw-bold text-warning">0</span></span>
                                </div>
                                <div>
                                    <button type="button" class="btn btn-sm btn-secondary"
                                        id="cancelParseBtn">取消</button>
                                    <button type="button" class="btn btn-sm btn-primary ms-2"
                                        id="startImportBtn">开始导入</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 导入进度和日志 -->
                    <div id="importProgressArea" class="mt-4 d-none">
                        <h6 class="border-bottom pb-2">导入进度</h6>
                        <div class="progress mb-3">
                            <div id="importProgressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                                role="progressbar" style="width: 0%"></div>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>已处理: <span id="processedCount" class="fw-bold">0</span>/<span
                                    id="totalCount">0</span></span>
                            <span>成功: <span id="successCount" class="fw-bold text-success">0</span></span>
                            <span>失败: <span id="failCount" class="fw-bold text-danger">0</span></span>
                        </div>

                        <!-- 导入日志 -->
                        <div class="card">
                            <div class="card-header bg-light py-1 d-flex justify-content-between align-items-center">
                                <span>导入日志</span>
                                <button class="btn btn-sm btn-outline-secondary" id="copyLogsBtn">
                                    <i class="bi bi-clipboard"></i> 复制
                                </button>
                            </div>
                            <div class="card-body p-0">
                                <div id="importLogs" class="bg-dark text-light p-2"
                                    style="max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.85rem;">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" id="parseExcelBtn">解析Excel</button>
                    <button type="button" class="btn btn-success d-none" id="completeImportBtn"
                        data-bs-dismiss="modal">完成导入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 确认删除模态框 -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>确定要删除域名 <span id="deleteConfigDomain" class="fw-bold"></span> 的配置吗？此操作不可恢复。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 批量删除确认模态框 -->
    <div class="modal fade" id="batchDeleteModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">批量删除确认</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <strong>警告：</strong>此操作将永久删除域名配置，无法恢复！
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <strong>批次号：</strong><span id="batchDeletePhone" class="fw-bold text-primary"></span>
                        </div>
                        <div class="col-md-6">
                            <div id="batchDeleteTypeInfo">
                                <!-- 删除类型和数量信息将在这里动态显示 -->
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <h6>将删除以下域名：</h6>
                        <div id="batchDeleteDomainList" class="border rounded p-2 bg-light" style="max-height: 250px; overflow-y: auto;">
                            <!-- 域名列表将在这里动态显示 -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" id="confirmBatchDeleteBtn">
                        <i class="bi bi-trash"></i> 确认删除
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // API基础URL
        const API_BASE_URL = '/admin/config';

        // DOM元素
        const phoneGroupTableBody = document.getElementById('phoneGroupTableBody');
        const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
        const batchDeleteModal = new bootstrap.Modal(document.getElementById('batchDeleteModal'));
        const uploadTemplateModal = new bootstrap.Modal(document.getElementById('uploadTemplateModal'));

        // 当前操作的配置ID
        let currentConfigId = null;

        // 保存所有配置的数据
        let allConfigurations = [];

        // 导入相关变量
        let parsedData = [];
        let importQueue = [];
        let isImporting = false;
        let importStats = {
            total: 0,
            processed: 0,
            success: 0,
            failed: 0,
            logs: []
        };

        // tooltip元素
        let tooltipElement = null;

        // 显示工具提示
        function showTooltip(event, tooltipText) {
            if (!tooltipText || tooltipText === '-') return;

            // 隐藏任何现有工具提示
            hideTooltip();

            // 创建新的工具提示元素
            tooltipElement = document.createElement('div');
            tooltipElement.className = 'custom-tooltip';
            tooltipElement.textContent = tooltipText;
            document.body.appendChild(tooltipElement);

            // 定位工具提示
            const x = event.clientX + 10;
            const y = event.clientY + 10;

            // 确保工具提示不会超出视口
            const tooltipWidth = tooltipElement.offsetWidth;
            const tooltipHeight = tooltipElement.offsetHeight;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            let finalX = x;
            let finalY = y;

            if (x + tooltipWidth > viewportWidth) {
                finalX = viewportWidth - tooltipWidth - 10;
            }

            if (y + tooltipHeight > viewportHeight) {
                finalY = viewportHeight - tooltipHeight - 10;
            }

            tooltipElement.style.left = finalX + 'px';
            tooltipElement.style.top = finalY + 'px';
            tooltipElement.style.opacity = '1';
        }

        // 隐藏工具提示
        function hideTooltip() {
            if (tooltipElement) {
                document.body.removeChild(tooltipElement);
                tooltipElement = null;
            }
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function () {
            // 加载所有配置
            loadConfigurations();

            // 确认删除按钮点击事件
            document.getElementById('confirmDeleteBtn').addEventListener('click', deleteConfiguration);

            // 确认批量删除按钮点击事件
            document.getElementById('confirmBatchDeleteBtn').addEventListener('click', function() {
                const phone = this.getAttribute('data-phone');
                const configIds = this.getAttribute('data-config-ids').split(',');
                batchDeleteModal.hide();
                executeBatchDeleteConfirmed(configIds, phone);
            });

            // 上传模板按钮点击事件
            document.getElementById('uploadTemplateBtn').addEventListener('click', function () {
                // 重置相关UI状态
                resetImportState();
                uploadTemplateModal.show();
            });

            // 解析Excel按钮点击事件
            document.getElementById('parseExcelBtn').addEventListener('click', function () {
                parseExcelFile();
            });

            // 取消解析按钮点击事件
            document.getElementById('cancelParseBtn').addEventListener('click', function () {
                document.getElementById('parseResultArea').classList.add('d-none');
                document.getElementById('parseExcelBtn').classList.remove('d-none');
                document.getElementById('templateFile').value = '';
            });

            // 开始导入按钮点击事件
            document.getElementById('startImportBtn').addEventListener('click', function () {
                startImport();
            });

            // 复制日志按钮点击事件
            document.getElementById('copyLogsBtn').addEventListener('click', function () {
                copyImportLogs();
            });

            // 完成导入按钮点击事件
            document.getElementById('completeImportBtn').addEventListener('click', function () {
                // 关闭模态框并刷新数据
                uploadTemplateModal.hide();
                loadConfigurations();
            });
        });

        // 重置导入状态
        function resetImportState() {
            // 重置数据
            parsedData = [];
            importQueue = [];
            isImporting = false;
            importStats = {
                total: 0,
                processed: 0,
                success: 0,
                failed: 0,
                logs: []
            };

            // 重置UI元素
            document.getElementById('parseResultArea').classList.add('d-none');
            document.getElementById('importProgressArea').classList.add('d-none');
            document.getElementById('parseExcelBtn').classList.remove('d-none');
            document.getElementById('completeImportBtn').classList.add('d-none');
            document.getElementById('templateFile').value = '';
            document.getElementById('parseResultTableBody').innerHTML = '';
            document.getElementById('importLogs').innerHTML = '';

            // 重置计数器
            document.getElementById('totalRecords').textContent = '0';
            document.getElementById('newRecords').textContent = '0';
            document.getElementById('conflictRecords').textContent = '0';
            document.getElementById('processedCount').textContent = '0';
            document.getElementById('totalCount').textContent = '0';
            document.getElementById('successCount').textContent = '0';
            document.getElementById('failCount').textContent = '0';
            document.getElementById('importProgressBar').style.width = '0%';
        }

        // 解析Excel文件
        function parseExcelFile() {
            const fileInput = document.getElementById('templateFile');
            if (fileInput.files.length === 0) {
                alert('请选择模板文件');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // 添加加载指示器
            document.getElementById('parseExcelBtn').innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>解析中...';
            document.getElementById('parseExcelBtn').disabled = true;

            reader.onload = function (e) {
                try {
                    // 使用SheetJS解析Excel
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // 获取第一个工作表
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];

                    // 转换为JSON
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    // 检查格式
                    if (jsonData.length < 2) {
                        throw new Error('Excel文件格式不正确或没有数据');
                    }

                    // 提取表头
                    const headers = jsonData[0];

                    // 检查必要的字段
                    const requiredFields = ['域名'];
                    const missingFields = requiredFields.filter(field => !headers.includes(field));

                    if (missingFields.length > 0) {
                        throw new Error(`Excel文件缺少必要的字段: ${missingFields.join(', ')}`);
                    }

                    // 检查是否包含服务器编号字段
                    const hasServerInfo = headers.includes('服务器编号') || headers.includes('备注');
                    if (hasServerInfo) {
                        console.log('Excel文件包含服务器编号字段');
                    } else {
                        console.warn('Excel文件未包含服务器编号字段，将使用默认值');
                    }

                    // 检查可选字段的存在性
                    const optionalFields = ['模版', '评论规则', '改写规则', '文章分配规则', '服务器编号'];
                    const presentOptionalFields = optionalFields.filter(field => headers.includes(field));
                    console.log(`发现以下可选字段: ${presentOptionalFields.join(', ')}`);

                    // 提取数据
                    parsedData = [];
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        if (row.length === 0 || !row[0]) continue;  // 跳过空行

                        const item = {};
                        for (let j = 0; j < headers.length; j++) {
                            item[headers[j]] = row[j] !== undefined ? row[j] : '';
                        }

                        // 添加状态字段
                        item['状态'] = item['状态'] || '启用';

                        // 确保配置字段有合适的默认值
                        item['模版'] = item['模版'] || '';
                        item['评论规则'] = item['评论规则'] || '';
                        item['改写规则'] = item['改写规则'] || '';
                        item['文章分配规则'] = item['文章分配规则'] || '';
                        
                        // 处理服务器编号字段（支持多种字段名）
                        item['服务器编号'] = item['服务器编号'] || item['备注'] || '默认服务器';

                        // 验证域名
                        if (!item['域名']) {
                            continue;  // 跳过无域名记录
                        }

                        parsedData.push(item);
                    }

                    if (parsedData.length === 0) {
                        throw new Error('没有找到有效的数据记录');
                    }

                    // 检查是否存在冲突（已存在的域名）
                    checkConflicts(parsedData).then(result => {
                        // 重置UI
                        document.getElementById('parseExcelBtn').innerHTML = '解析Excel';
                        document.getElementById('parseExcelBtn').disabled = false;
                        document.getElementById('parseExcelBtn').classList.add('d-none');
                        // 显示解析结果
                        document.getElementById('parseResultArea').classList.remove('d-none');
                        // 更新统计信息
                        document.getElementById('totalRecords').textContent = result.total;
                        document.getElementById('newRecords').textContent = result.new;
                        document.getElementById('conflictRecords').textContent = result.conflict;
                        // 渲染表格
                        renderParseResultTable(result.data);
                    }).catch(error => {
                        alert(`检查冲突失败: ${error.message}`);
                        document.getElementById('parseExcelBtn').innerHTML = '解析Excel';
                        document.getElementById('parseExcelBtn').disabled = false;
                    });

                } catch (error) {
                    console.error('Excel解析错误:', error);
                    alert(`Excel解析失败: ${error.message}`);
                    // 重置UI
                    document.getElementById('parseExcelBtn').innerHTML = '解析Excel';
                    document.getElementById('parseExcelBtn').disabled = false;
                }
            };

            reader.onerror = function () {
                alert('读取文件失败');
                document.getElementById('parseExcelBtn').innerHTML = '解析Excel';
                document.getElementById('parseExcelBtn').disabled = false;
            };

            reader.readAsArrayBuffer(file);
        }

        // 检查数据冲突
        async function checkConflicts(data) {
            // 准备检查域名是否已存在
            const domains = data.map(item => item['域名']);
            const defaultOverwrite = document.getElementById('templateOverwriteExisting').checked;

            try {
                // 调用后端API检查域名是否存在
                const response = await fetch(`${API_BASE_URL}/domain/check-exists`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(domains)
                });

                if (!response.ok) {
                    throw new Error(`HTTP错误！状态: ${response.status}`);
                }

                const result = await response.json();
                const existingDomains = new Set(result);

                // 标记冲突数据
                let newCount = 0;
                let conflictCount = 0;

                data.forEach(item => {
                    const isDuplicate = existingDomains.has(item['域名']);
                    item['_conflict'] = isDuplicate;
                    item['_overwrite'] = defaultOverwrite;

                    if (isDuplicate) {
                        conflictCount++;
                    } else {
                        newCount++;
                    }
                });

                return {
                    data: data,
                    total: data.length,
                    new: newCount,
                    conflict: conflictCount
                };

            } catch (error) {
                console.error('检查域名冲突失败:', error);

                // 如果API调用失败，我们可以回退到客户端检查
                // 这只是一个简单的回退方案，实际上我们应该基于现有数据进行更精确的检查
                console.log("API调用失败，使用客户端缓存检查");

                // 从现有配置中提取所有域名
                const existingDomains = new Set(
                    allConfigurations.map(config => config.domain)
                );

                // 标记冲突数据
                let newCount = 0;
                let conflictCount = 0;

                data.forEach(item => {
                    const isDuplicate = existingDomains.has(item['域名']);
                    item['_conflict'] = isDuplicate;
                    item['_overwrite'] = defaultOverwrite;

                    if (isDuplicate) {
                        conflictCount++;
                    } else {
                        newCount++;
                    }
                });

                return {
                    data: data,
                    total: data.length,
                    new: newCount,
                    conflict: conflictCount
                };
            }
        }

            const newCount = parsedData.filter(item => !item['_conflict']).length;

        // 开始导入
        function startImport() {
            // 过滤掉不导入的记录（冲突且不覆盖）
            importQueue = parsedData.filter(item => !item['_conflict'] || item['_overwrite']);

            if (importQueue.length === 0) {
                alert('没有需要导入的数据');
                return;
            }

            // 确认导入
            if (!confirm(`将导入${importQueue.length}条数据，其中${parsedData.filter(item => !item['_conflict']).length}条新增，${parsedData.filter(item => item['_conflict'] && item['_overwrite']).length}条覆盖。确定继续吗？`)) {
                return;
            }

            // 为本批次生成一个随机批次号（手机号）
            const batchPhone = generateRandomPhone();

            // 初始化导入状态
            importStats = {
                total: importQueue.length,
                processed: 0,
                success: 0,
                failed: 0,
                logs: [],
                batchPhone: batchPhone
            };

            // 更新UI
            document.getElementById('parseResultArea').classList.add('d-none');
            document.getElementById('importProgressArea').classList.remove('d-none');
            document.getElementById('totalCount').textContent = importStats.total;

            // 标记导入开始
            isImporting = true;

            // 添加导入日志
            addImportLog('开始导入，批次号: ' + batchPhone + '，共' + importStats.total + '条数据');

            // 开始导入
            processNextItem();
        }

        // 处理下一个导入项
        function processNextItem() {
            if (importQueue.length === 0 || !isImporting) {
                // 导入完成
                completeImport();
                return;
            }

            // 取出队列中的第一项
            const item = importQueue.shift();

            // 打印数据类型，帮助调试
            console.log('正在处理项目:', item);
            console.log('评论规则类型:', typeof item['评论规则'], '值:', item['评论规则']);
            console.log('改写规则类型:', typeof item['改写规则'], '值:', item['改写规则']);
            console.log('文章规则类型:', typeof item['文章分配规则'], '值:', item['文章分配规则']);

            // 构建API参数
            const domainConfig = {
                domain: item['域名'],
                title: item['标题'] || '',
                description: item['描述'] || '',
                keywords: item['关键词'] || '',
                serverInfo: item['服务器编号'] || '',
                contactPhone: importStats.batchPhone, // 使用本批次的批次号
                status: item['状态'] === '禁用' ? 0 : 1,
                // 添加模版和规则字段，确保传递字符串到parseRuleIds
                viewsPath: item['模版'] || '',
                commentRuleIds: parseRuleIds(String(item['评论规则'] || '')),
                rewriteRuleIds: parseRuleIds(String(item['改写规则'] || '')),
                articleRuleIds: parseRuleIds(String(item['文章分配规则'] || ''))
            };

            // 记录开始导入该项
            addImportLog(`正在导入: ${domainConfig.domain}`);

            // 调用API导入单条数据
            fetch(`${API_BASE_URL}/domain/single`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    domainConfig: domainConfig,
                    overwrite: item['_conflict'] && item['_overwrite']
                })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP错误！状态: ${response.status}`);
                    }
                    return response.json();
                })
                .then(result => {
                    // 更新统计
                    importStats.processed++;

                    if (result.success) {
                        importStats.success++;
                        // 更新日志
                        addImportLog(`导入成功: ${domainConfig.domain}`);
                    } else {
                        importStats.failed++;
                        addImportLog(`导入失败: ${domainConfig.domain} - ${result.message || '未知错误'}`, true);
                    }

                    // 更新UI
                    updateImportProgress();

                    // 处理下一项（稍微延迟以避免请求过快）
                    setTimeout(processNextItem, 200);
                })
                .catch(error => {
                    console.error('导入失败:', error);

                    // 更新统计
                    importStats.processed++;
                    importStats.failed++;

                    // 更新日志
                    addImportLog(`导入失败: ${domainConfig.domain} - ${error.message}`, true);

                    // 更新UI
                    updateImportProgress();

                    // 处理下一项
                    setTimeout(processNextItem, 200);
                });
        }

        // 解析规则ID字符串为数组
        function parseRuleIds(idString) {
            // 确保输入是字符串
            if (!idString || idString === '-' || typeof idString !== 'string') {
                // 如果输入是数字，直接返回包含该数字的数组
                if (typeof idString === 'number') {
                    return [idString];
                }
                // 如果输入已经是数组，直接返回
                if (Array.isArray(idString)) {
                    return idString;
                }
                // 其他情况返回空数组
                return [];
            }

            return idString.split(',')
                .map(id => id.trim())
                .filter(id => id && !isNaN(parseInt(id)))
                .map(id => parseInt(id));
        }

        // 生成随机手机号
        function generateRandomPhone() {
            // 生成随机手机号
            let phone = "1";

            // 第二位数字：3, 4, 5, 6, 7, 8, 9
            const secondDigits = ["3", "4", "5", "6", "7", "8", "9"];
            phone += secondDigits[Math.floor(Math.random() * secondDigits.length)];

            // 生成剩余9位数字
            for (let i = 0; i < 9; i++) {
                phone += Math.floor(Math.random() * 10);
            }

            return phone;
        }

        // 按服务器编号分组配置数据
        function groupConfigurationsByServer(configurations) {
            const serverGroups = {};

            configurations.forEach(config => {
                const serverInfo = config.serverInfo || '未设置服务器';
                const phone = config.contactPhone || '未设置';

                if (!serverGroups[serverInfo]) {
                    serverGroups[serverInfo] = {
                        serverInfo: serverInfo,
                        phoneGroups: {},
                        totalDomainCount: 0,
                        totalEnabledCount: 0,
                        totalDisabledCount: 0,
                        batchCount: 0
                    };
                }

                if (!serverGroups[serverInfo].phoneGroups[phone]) {
                    serverGroups[serverInfo].phoneGroups[phone] = {
                        phone: phone,
                        serverInfo: serverInfo,
                        configs: [],
                        domainCount: 0,
                        enabledCount: 0,
                        disabledCount: 0
                    };
                    serverGroups[serverInfo].batchCount++;
                }

                // 将单个配置添加到对应的批次组中
                serverGroups[serverInfo].phoneGroups[phone].configs.push(config);
                
                // 重新计算该批次的统计信息
                const phoneGroup = serverGroups[serverInfo].phoneGroups[phone];
                phoneGroup.domainCount = phoneGroup.configs.length;
                phoneGroup.enabledCount = phoneGroup.configs.filter(c => c.status === 1).length;
                phoneGroup.disabledCount = phoneGroup.configs.filter(c => c.status === 0).length;
            });

            // 重新计算服务器级别的统计信息
            Object.values(serverGroups).forEach(serverGroup => {
                serverGroup.totalDomainCount = 0;
                serverGroup.totalEnabledCount = 0;
                serverGroup.totalDisabledCount = 0;
                
                Object.values(serverGroup.phoneGroups).forEach(phoneGroup => {
                    serverGroup.totalDomainCount += phoneGroup.domainCount;
                    serverGroup.totalEnabledCount += phoneGroup.enabledCount;
                    serverGroup.totalDisabledCount += phoneGroup.disabledCount;
                });
            });

            // 转换为数组格式
            return Object.values(serverGroups).map(serverGroup => ({
                ...serverGroup,
                phoneGroups: Object.values(serverGroup.phoneGroups)
            }));
        }

        // 更新本地配置缓存
        function updateLocalConfigurations(phone, configs) {
            // 移除当前手机号对应的配置
            allConfigurations = allConfigurations.filter(config => (config.contactPhone || '未设置') !== phone);

            // 添加新获取的配置
            allConfigurations = allConfigurations.concat(configs);
        }

        // 修改批量更新状态函数，支持异步加载的情况
        function batchUpdateStatusByPhone(phone, status) {
            // 先尝试从本地获取该手机号的配置
            let configsById = allConfigurations.filter(config => (config.contactPhone || '未设置') === phone)
                .reduce((map, config) => {
                    map[config.id] = config;
                    return map;
                }, {});

            // 获取该手机号下所有已选中的配置ID
            const selectedIds = Array.from(document.querySelectorAll(`.row-checkbox[data-phone="${phone}"]:checked`))
                .map(checkbox => checkbox.getAttribute('data-id'));

            // 如果没有选中的ID，则获取该手机号下所有配置ID
            let configIds = selectedIds.length > 0 ? selectedIds : Object.keys(configsById);

            if (configIds.length === 0) {
                // 如果本地没有配置数据，需要先加载
                const loadingMessage = selectedIds.length > 0 ?
                    '正在获取选中的配置信息...' :
                    `正在获取手机号 ${phone} 下的所有配置信息...`;

                alert(loadingMessage);

                // 加载数据后再处理
                fetch(`${API_BASE_URL}/domain/by-phone?phone=${encodeURIComponent(phone)}&domain=`)
                    .then(response => response.json())
                    .then(data => {
                        const loadedConfigIds = data.map(config => config.id);
                        if (loadedConfigIds.length === 0) {
                            alert('未找到该手机号下的配置，无法进行批量操作');
                            return;
                        }

                        // 更新本地缓存
                        updateLocalConfigurations(phone, data);

                        // 执行批量更新
                        executeBatchUpdate(loadedConfigIds, status, phone);
                    })
                    .catch(error => {
                        console.error('Error loading domains for batch update:', error);
                        alert('获取配置信息失败，无法进行批量操作');
                    });
                return;
            }

            // 执行批量更新
            executeBatchUpdate(configIds, status, phone);
        }

        // 执行批量更新
        function executeBatchUpdate(configIds, status, phone) {
            if (configIds.length === 0) return;

            if (!confirm(`确定要${status === 1 ? '启用' : '禁用'}该手机号(${phone})下的${configIds.length}个域名配置吗？`)) {
                return;
            }

            Promise.all(configIds.map(id =>
                fetch(`${API_BASE_URL}/domain/${id}/status?status=${status}`, {
                    method: 'PUT'
                })
            ))
                .then(responses => {
                    if (responses.every(response => response.ok)) {
                        // 更新已选中的开关状态而不是重新加载整个表格
                        document.querySelectorAll(`.status-switch[data-id]`).forEach(switchEl => {
                            const id = switchEl.getAttribute('data-id');
                            if (configIds.includes(id)) {
                                switchEl.checked = status === 1;

                                // 更新本地数据
                                const configIndex = allConfigurations.findIndex(c => c.id == id);
                                if (configIndex >= 0) {
                                    allConfigurations[configIndex].status = status;
                                }
                            }
                        });

                        // 更新手机号组的状态标识
                        updatePhoneGroupStatus(phone);

                        alert(`批量${status === 1 ? '启用' : '禁用'}成功！`);
                    } else {
                        throw new Error('部分更新失败');
                    }
                })
                .catch(error => {
                    console.error('Error batch updating status:', error);
                    alert('批量更新状态失败，请重试');

                    // 如果出错，重新加载该手机号下的数据
                    if (document.querySelector(`.phone-details[data-phone="${phone}"]:not(.d-none)`)) {
                        loadDomainsByPhone(phone);
                    }
                });
        }

            const configs = allConfigurations.filter(config => (config.contactPhone || '未设置') === phone);

            const totalCount = configs.length;

            const statusBadge = document.querySelector(`.phone-group[data-phone="${phone}"] td:nth-child(4) .badge`);
            if (statusBadge) {
                statusBadge.className = `badge ${activeCount > 0 ? 'bg-success' : 'bg-danger'}`;
                statusBadge.textContent = `${activeCount}/${totalCount} 启用`;
            }
        }

                document.querySelectorAll('.sub-select-all').forEach(cb => cb.checked = isChecked);

        // 更新组内全选复选框状态
        function updateSubSelectAllCheckbox(phone) {
            const subSelectAll = document.querySelector(`.sub-select-all[data-phone="${phone}"]`);
            if (!subSelectAll) return;

            const groupCheckboxes = document.querySelectorAll(`.row-checkbox[data-phone="${phone}"]`);
            const checkedCount = document.querySelectorAll(`.row-checkbox[data-phone="${phone}"]:checked`).length;

            subSelectAll.checked = checkedCount === groupCheckboxes.length;
            subSelectAll.indeterminate = checkedCount > 0 && checkedCount < groupCheckboxes.length;
        }

        // 更新组复选框状态
        function updateGroupCheckbox(phone) {
            const groupCheckbox = document.querySelector(`.group-checkbox[data-phone="${phone}"]`);
            if (!groupCheckbox) return;

            const groupCheckboxes = document.querySelectorAll(`.row-checkbox[data-phone="${phone}"]`);
            const checkedCount = document.querySelectorAll(`.row-checkbox[data-phone="${phone}"]:checked`).length;

            groupCheckbox.checked = checkedCount === groupCheckboxes.length;
            groupCheckbox.indeterminate = checkedCount > 0 && checkedCount < groupCheckboxes.length;
        }

        // 更新全选复选框状态
        function updateSelectAllCheckbox() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const rowCheckboxes = document.querySelectorAll('.row-checkbox');
            const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;

            selectAllCheckbox.checked = checkedCount === rowCheckboxes.length && rowCheckboxes.length > 0;

        // 更新批量操作按钮的显示状态
        function updateBatchOperationsVisibility() {
            const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
            const batchOperations = document.getElementById('batchOperations');
            const selectedCount = document.getElementById('selectedCount');
            
            if (batchOperations) {

        // 批量更新选中项目的状态
        function batchUpdateSelectedStatus(status) {
            const selectedIds = Array.from(document.querySelectorAll('.row-checkbox:checked'))
                .map(checkbox => checkbox.getAttribute('data-id'));

            if (selectedIds.length === 0) {
                alert('请选择要操作的配置');
                return;
            }

            if (!confirm(`确定要${status === 1 ? '启用' : '禁用'}选中的 ${selectedIds.length} 个域名配置吗？`)) {
                return;
            }

            // 显示进度
            const actionText = status === 1 ? '启用' : '禁用';
            const progressAlert = document.createElement('div');
            progressAlert.className = 'alert alert-info';
            progressAlert.innerHTML = `
                <div class="d-flex align-items-center">
                    <div class="spinner-border spinner-border-sm me-2" role="status">
                        <span class="visually-hidden">处理中...</span>
                    </div>
                    正在${actionText}选中的配置...
                </div>
            `;
            document.querySelector('.card-body').insertBefore(progressAlert, document.getElementById('batchOperations'));

            Promise.all(selectedIds.map(id =>
                fetch(`${API_BASE_URL}/domain/${id}/status?status=${status}`, {
                    method: 'PUT'
                })
            ))
                .then(responses => {
                    progressAlert.remove();
                    
                    if (responses.every(response => response.ok)) {
                        // 更新界面中的状态开关
                        selectedIds.forEach(id => {
                            const statusSwitch = document.querySelector(`.status-switch[data-id="${id}"]`);
                            if (statusSwitch) {
                                statusSwitch.checked = status === 1;
                            }

                            // 更新本地数据
                            const configIndex = allConfigurations.findIndex(c => c.id == id);
                            if (configIndex >= 0) {
                                allConfigurations[configIndex].status = status;
                            }
                        });

                        // 更新各个手机号组的状态标识
                        const affectedPhones = new Set();
                        selectedIds.forEach(id => {
                            const config = allConfigurations.find(c => c.id == id);
                            if (config) {
                                affectedPhones.add(config.contactPhone || '未设置');
                            }
                        });
                        
                        affectedPhones.forEach(phone => updatePhoneGroupStatus(phone));

                        alert(`批量${actionText}成功！共${actionText}了 ${selectedIds.length} 个配置。`);
                        
                        // 清除选中状态
                        document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                        document.getElementById('selectAll').checked = false;
                        updateBatchOperationsVisibility();
                    } else {
                        throw new Error('部分更新失败');
                    }
                })
                .catch(error => {
                    progressAlert.remove();
                    console.error('Error batch updating status:', error);
                    alert(`批量${actionText}失败，请重试`);
                });
        }

        // 显示批量配置模态框
        function showBatchConfigModal(type, phone, domain) {

                'keyword': '关键词',

            };

            // 获取该手机号下所有域名ID

                // 获取该域名ID
                const domainId = allConfigurations
                    .find(config => config.domain === domain)
                    .id;

                    .filter(config => (config.contactPhone || '未设置') === phone)

                fetch(`${API_BASE_URL}/domain/by-phone?phone=${encodeURIComponent(phone)}&domain=${domain}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.length === 0) {
                            alert('未找到该手机号下的配置，无法进行批量操作');
                            return;
                        }
                        // 更新本地缓存
                        updateLocalConfigurations(phone, data);
                        // 获取域名列表
                        const domains = data.map(c => c.domain).join(', ');
                        const ids = data.map(c => c.id);
                        // 确认操作
                        confirmBatchConfig(type, phone, ids, domains);
                    })
                    .catch(error => {
                        console.error(`Error loading domains for batch ${type}:`, error);
                        alert('获取配置信息失败，无法进行批量操作');
                    });
                return;
            }

            // 获取域名列表
            const domains = allConfigurations
                .filter(config => (config.contactPhone || '未设置') === phone)
                .map(config => config.domain)
                .join(', ');

            // 确认操作
            confirmBatchConfig(type, phone, domainIds, domains);
        }

        // 确认批量配置操作
        function confirmBatchConfig(type, phone, domainIds, domains) {
            const configTypes = {
                'keyword': '关键词',
                'comment': '评论规则',
                'article': '文章'
            };

            const maxDisplayLength = 100;
            const displayDomains = domains.length > maxDisplayLength ?
                domains.substring(0, maxDisplayLength) + '...' :
                domains;

            // 使用Bootstrap Modal弹窗替代原来的window.open
            // 创建Modal容器(如果不存在)
            if (!document.getElementById('configModal')) {
                const modalHtml = `
                    <div class="modal fade" id="configModal" tabindex="-1" aria-labelledby="configModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-lg modal-dialog-scrollable">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="configModalTitle">批量配置</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                </div>
                                <div class="modal-body" id="configModalBody">
                                    <div class="text-center py-5">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">加载中...</span>
                                        </div>
                                        <p class="mt-2">正在加载配置...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                const modalElement = document.createRange().createContextualFragment(modalHtml);
                document.body.appendChild(modalElement);
            }

            // 更新Modal标题
            document.getElementById('configModalTitle').textContent = `批量配置${configTypes[type]}`;

            // 显示Modal
            const configModal = new bootstrap.Modal(document.getElementById('configModal'));
            configModal.show();
            // 处理domainIds，确保它是字符串格式
            let domainIdsStr = Array.isArray(domainIds) ? domainIds.join(',') : domainIds;

            // 如果domainIds是数组,需要转换为逗号分隔的字符串
            if (domainIds instanceof Array) {
                domainIdsStr = domainIds.join(',');
            }
            // 通过AJAX加载配置内容
            fetch(`/admin/config/${type}?batchIds=${domainIdsStr}&phone=${phone}`)
                .then(response => response.text())
                .then(html => {
                    document.getElementById('configModalBody').innerHTML = html;

                    // 获取加载的表单,修改提交行为
                    const configForm = document.getElementById('configModalBody').querySelector('form');
                    if (configForm) {
                        // 替换原表单提交代码中的window.close()
                        const originalSubmitEvent = configForm.onsubmit;
                        configForm.onsubmit = function (e) {
                            e.preventDefault();

                            const formData = new FormData(this);
                            const domainIds = formData.get('domainIds');

                            // 根据表单类型获取选中的ID
                            let selectedItems = [];
                            let formDataObj = {};
                            let saveUrl = '';

                            // 根据type类型确定处理方式
                            if (type === 'article') {
                                formData.getAll('selectedRules').forEach(id => {
                                    selectedItems.push(parseInt(id));
                                });
                                formDataObj = {
                                    domainIds: formData.get('domainIds'),
                                    phone: formData.get('phone'),
                                    selectedRules: selectedItems,
                                    overwriteExisting: formData.has('overwriteExisting')
                                };
                                saveUrl = '/admin/config/article/save';
                            } else if (type === 'comment') {
                                formData.getAll('selectedRules').forEach(id => {
                                    selectedItems.push(parseInt(id));
                                });
                                formDataObj = {
                                    domainIds: formData.get('domainIds'),
                                    phone: formData.get('phone'),
                                    selectedRules: selectedItems,
                                    overwriteExisting: formData.has('overwriteExisting')
                                };
                                saveUrl = '/admin/config/comment/save';
                            } else if (type === 'keyword') {
                                formData.getAll('selectedKeywords').forEach(id => {
                                    selectedItems.push(parseInt(id));
                                });
                                formDataObj = {
                                    domainIds: formData.get('domainIds'),
                                    phone: formData.get('phone'),
                                    selectedRules: selectedItems,
                                    overwriteExisting: formData.has('overwriteExisting')
                                };
                                saveUrl = '/admin/config/keyword/save';
                            }
                            // 发送请求前显示加载提示
                            const saveBtn = this.querySelector('button[type="submit"]');
                            const originalText = saveBtn.innerHTML;
                            saveBtn.disabled = true;
                            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>保存中...';
                            // 发送请求
                            fetch(saveUrl, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'Accept': 'application/json'
                                },
                                body: JSON.stringify(formDataObj)
                            }).then(response => response.json())
                                .then(result => {
                                    // 恢复按钮状态
                                    saveBtn.disabled = false;
                                    saveBtn.innerHTML = originalText;
                                    // 使用普通alert替代SweetAlert2
                                    alert(`${configTypes[type]}配置已保存！`);
                                    // 关闭Modal
                                    configModal.hide();
                                    // 刷新表格数据
                                    loadConfigurations();
                                }).catch(error => {
                                    // 恢复按钮状态
                                    saveBtn.disabled = false;
                                    saveBtn.innerHTML = originalText;

                                    console.error(`Error saving ${type} config:`, error);
                                    alert('保存失败: ' + (error.message || '未知错误'));
                                });
                        };

                        // 修改取消按钮行为
                        const cancelBtn = configForm.querySelector('button[onclick="window.close()"]');
                        if (cancelBtn) {
                            cancelBtn.onclick = function (e) {
                                e.preventDefault();
                                configModal.hide();
                            };
                        }
                    }
                })
                .catch(error => {
                    document.getElementById('configModalBody').innerHTML = `
                        <div class="alert alert-danger">·
                            <h5>加载失败</h5>
                            <p>${error.message || '无法加载配置界面'}</p>
                        </div>
                    `;
                });
        }

        // 通用配置弹窗函数
        function showConfigModal(type, id, domain) {
            const typeNames = {
                'keyword': 'SEO关键词',
                'comment': '评论规则',
                'article': '文章规则'
            };
            alert(`将打开${domain}的${typeNames[type]}配置页面，点击确定继续。`);

            // 这里可以根据实际需求跳转到相应的配置页面
            window.location.href = `/admin/config/${type}?domainId=${id}&domain=${domain}`;
        }

        // 批量删除按手机号
        function batchDeleteByPhone(phone) {
            // 先尝试从本地获取该手机号的配置
            let configsById = allConfigurations.filter(config => (config.contactPhone || '未设置') === phone)
                .reduce((map, config) => {
                    map[config.id] = config;
                    return map;
                }, {});

            // 获取该手机号下所有已选中的配置ID
            const selectedIds = Array.from(document.querySelectorAll(`.row-checkbox[data-phone="${phone}"]:checked`))
                .map(checkbox => checkbox.getAttribute('data-id'));

            // 检查是否有选中的项目
            if (selectedIds.length === 0) {
                // 如果没有选中任何项目，提示用户选择
                const groupCheckbox = document.querySelector(`.group-checkbox[data-phone="${phone}"]`);
                if (groupCheckbox) {
                    // 高亮显示该组
                    const phoneGroupRow = document.querySelector(`.phone-group[data-phone="${phone}"]`);
                    if (phoneGroupRow) {
                        phoneGroupRow.style.backgroundColor = '#fff3cd';
                        setTimeout(() => {
                            phoneGroupRow.style.backgroundColor = '';
                        }, 3000);
                    }
                }
                
                alert(`请先勾选要删除的域名配置。\n\n操作方法：\n1. 点击批次号"${phone}"展开域名列表\n2. 勾选要删除的域名配置\n3. 再次点击"删除"按钮`);
                return;
            }

            // 如果本地没有配置数据，需要先加载
            if (Object.keys(configsById).length === 0) {
                alert('正在获取配置信息...');

                // 加载数据后再处理
                fetch(`${API_BASE_URL}/domain/by-phone?phone=${encodeURIComponent(phone)}&domain=`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.length === 0) {
                            alert('未找到该手机号下的配置，无法进行批量删除');
                            return;
                        }

                        // 更新本地缓存
                        updateLocalConfigurations(phone, data);

                        // 重新检查选中的ID是否有效
                        const validSelectedIds = selectedIds.filter(id => 
                            data.some(config => config.id.toString() === id)
                        );

                        if (validSelectedIds.length === 0) {
                            alert('未找到有效的选中配置，请重新选择');
                            return;
                        }

                        // 执行批量删除
                        executeBatchDelete(validSelectedIds, phone, true);
                    })
                    .catch(error => {
                        console.error('Error loading domains for batch delete:', error);
                        alert('获取配置信息失败，无法进行批量删除');
                    });
                return;
            }

            // 执行批量删除（只删除选中的项目）
            executeBatchDelete(selectedIds, phone, true);
        }

        // 执行批量删除
        function executeBatchDelete(configIds, phone, isSelectedOnly = false) {
            if (configIds.length === 0) return;

            // 获取要删除的域名列表用于确认
            const domainsToDelete = configIds.map(id => {
                const config = allConfigurations.find(c => c.id == id);
                return config ? config.domain : `ID:${id}`;
            });

            // 显示批量删除确认模态框
            showBatchDeleteConfirmation(configIds, phone, domainsToDelete, isSelectedOnly);
        }

        // 显示批量删除确认模态框
        function showBatchDeleteConfirmation(configIds, phone, domainsToDelete, isSelectedOnly = false) {
            // 更新模态框内容
            document.getElementById('batchDeletePhone').textContent = phone;
            
            // 更新删除类型说明
            const deleteTypeText = isSelectedOnly ? '已选中的' : '全部';
            const deleteTypeColor = isSelectedOnly ? 'bg-warning' : 'bg-danger';
            document.getElementById('batchDeleteTypeInfo').innerHTML = 
                `<strong>删除类型：</strong><span class="badge ${deleteTypeColor}">${deleteTypeText}</span><br>
                 <strong>删除数量：</strong><span class="fw-bold text-danger">${configIds.length}</span> 个域名配置`;
            
            // 生成域名列表HTML，如果是选中的项目则高亮显示
            const domainListHtml = domainsToDelete.map((domain, index) => 
                `<div class="mb-1 ${isSelectedOnly ? 'bg-warning bg-opacity-25 p-1 rounded' : ''}">
                    <span class="badge ${isSelectedOnly ? 'bg-warning' : 'bg-secondary'} me-2">${index + 1}</span>
                    ${domain}
                    ${isSelectedOnly ? '<i class="bi bi-check-circle-fill text-success ms-2" title="已选中"></i>' : ''}
                </div>`
            ).join('');
            document.getElementById('batchDeleteDomainList').innerHTML = domainListHtml;

            // 设置确认按钮的数据属性
            const confirmBtn = document.getElementById('confirmBatchDeleteBtn');
            confirmBtn.setAttribute('data-phone', phone);
            confirmBtn.setAttribute('data-config-ids', configIds.join(','));
            
            // 更新确认按钮文本
            confirmBtn.innerHTML = `<i class="bi bi-trash"></i> 确认删除${isSelectedOnly ? '选中项' : '全部'}`;

            // 显示模态框
            batchDeleteModal.show();
        }

        // 执行已确认的批量删除
        function executeBatchDeleteConfirmed(configIds, phone) {
            let deleteBtn;
            let originalText;

            // 判断是全局删除还是按手机号删除
            if (phone === 'GLOBAL') {
                // 全局删除，显示在批量操作工具栏
                deleteBtn = document.querySelector('#batchOperations .btn-outline-danger');
                originalText = deleteBtn.innerHTML;
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>删除中...';

                // 调用通用批量删除API
                fetch(`${API_BASE_URL}/domain/batch-delete`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(configIds.map(id => parseInt(id)))
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP错误！状态: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(result => {
                        // 恢复按钮状态
                        deleteBtn.disabled = false;
                        deleteBtn.innerHTML = originalText;

                        if (result.success) {
                            // 从本地缓存中移除已删除的配置
                            allConfigurations = allConfigurations.filter(config => 
                                !configIds.includes(config.id.toString()));

                            // 重新加载配置列表
                            loadConfigurations();

                            alert(`批量删除成功！共删除了${result.deletedCount || configIds.length}个域名配置。`);
                            
                            // 清除选中状态
                            document.querySelectorAll('.row-checkbox:checked').forEach(cb => cb.checked = false);
                            document.getElementById('selectAll').checked = false;
                            updateBatchOperationsVisibility();
                        } else {
                            throw new Error(result.message || '批量删除失败');
                        }
                    })
                    .catch(error => {
                        console.error('批量删除错误:', error);
                        
                        // 恢复按钮状态
                        deleteBtn.disabled = false;
                        deleteBtn.innerHTML = originalText;

                        alert('批量删除失败：' + error.message);
                    });
            } else {
                // 按手机号删除，显示在对应的删除按钮
                deleteBtn = document.querySelector(`.batch-delete-btn[data-phone="${phone}"]`);
                originalText = deleteBtn.innerHTML;
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span>删除中...';

                // 调用按手机号批量删除API
                fetch(`${API_BASE_URL}/domain/batch-delete-by-phone`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: phone,
                        domainIds: configIds.map(id => parseInt(id))
                    })
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP错误！状态: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(result => {
                        // 恢复按钮状态
                        deleteBtn.disabled = false;
                        deleteBtn.innerHTML = originalText;

                        if (result.success) {
                            // 从本地缓存中移除已删除的配置
                            allConfigurations = allConfigurations.filter(config => 
                                !configIds.includes(config.id.toString()));

                            // 重新加载配置列表
                            loadConfigurations();

                            alert(`批量删除成功！共删除了${result.deletedCount || configIds.length}个域名配置。`);
                        } else {
                            throw new Error(result.message || '批量删除失败');
                        }
                    })
                    .catch(error => {
                        console.error('批量删除错误:', error);
                        
                        // 恢复按钮状态
                        deleteBtn.disabled = false;
                        deleteBtn.innerHTML = originalText;

                        alert('批量删除失败：' + error.message);

                        // 如果出错，重新加载该手机号下的数据
                        if (document.querySelector(`.phone-details[data-phone="${phone}"]:not(.d-none)`)) {
                            loadDomainsByPhone(phone);
                        }
                    });
            }
        }

        // 更新单个配置状态
        function updateStatus(id, status) {
            fetch(`${API_BASE_URL}/domain/${id}/status?status=${status}`, {
                method: 'PUT'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`更新失败: ${response.status}`);
                    }

                    // 更新本地数据
                    const configIndex = allConfigurations.findIndex(c => c.id == id);
                    if (configIndex >= 0) {
                        allConfigurations[configIndex].status = status;

                        // 获取该配置所属的手机号
                        const phone = allConfigurations[configIndex].contactPhone || '未设置';

                        // 更新手机号组的状态标识
                        updatePhoneGroupStatus(phone);
                    }
                })
                .catch(error => {
                    console.error('Error updating status:', error);
                    alert(`${status === 1 ? '启用' : '禁用'}失败: ${error.message}`);

                    // 恢复开关状态
                    const statusSwitch = document.querySelector(`.status-switch[data-id="${id}"]`);
                    if (statusSwitch) {
                        statusSwitch.checked = status === 0 ? true : false;
                    }
                });
        }

        // 批量导入结束后刷新表格
        function refreshTable() {
            loadConfigurations();
        }
    </script>
</body>
